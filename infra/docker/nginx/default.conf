# Single public origin: the browser only ever talks to this host.
#   /api, /sanctum, /up   -> Laravel (php-fpm)
#   everything else       -> Next.js
# TLS is terminated here (or at a load balancer in front); see docs/deployment.

upstream web { server web:3000; }

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Enable once HTTPS is in place:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ ^/(api|sanctum)/ {
        root /var/www/api/public;
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        root /var/www/api/public;
        try_files $uri /index.php?$query_string;
    }

    # Development payment simulator is only routed by Laravel in local/testing.
    location ^~ /dev/ {
        return 404;
    }

    location = /index.php {
        internal;
        root /var/www/api/public;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
